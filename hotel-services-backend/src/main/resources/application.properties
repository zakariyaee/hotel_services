spring.datasource.url=jdbc:mysql://localhost:3306/hotel_services_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8090
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
# Secours local uniquement ; en production, définir JWT_SECRET dans l'environnement.
jwt.secret=${JWT_SECRET:ZGV2LWhvdGVsLXNlcnZpY2VzLWp3dC1zZWNyZXQtY2hhbmdlLW1l}
jwt.expiration=86400000

# ===================================================================
# Configuration SMTP (Envoi réel des emails de réservation aux clients)
# Exemple pour Gmail :
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=votre.email@gmail.com
#   spring.mail.password=votre-mot-de-passe-d-application-16-caracteres
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Adresse et nom de l'expéditeur affichés au client
app.mail.from=${APP_MAIL_FROM:Grand Hôtel Intra-Services}
