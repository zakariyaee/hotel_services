@if (currentUser()?.role === 'ADMIN') {
  <div class="connected-page">
    <header class="connected-header">
      <div class="brand"><span class="brand-mark">⌁</span> MAISON <strong>ÉLAN</strong></div>
      <div class="connected-actions">
        <span class="connected-status"><i></i> Connecté · ADMIN</span>
        <button class="avatar" type="button" (click)="logout()">{{ currentUser()?.email?.slice(0, 2)?.toUpperCase() || 'AD' }}</button>
      </div>
    </header>
    <main>
      <app-admin-crud></app-admin-crud>
    </main>
  </div>
} @else {
  <app-client-dashboard></app-client-dashboard>
}
